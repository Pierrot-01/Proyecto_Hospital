<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Filtros de sombra suave -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Marcadores de flechas -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>

    <!-- Gradientes -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- TÍTULO PRINCIPAL -->
  <rect x="30" y="20" width="1140" height="60" rx="8" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="600" y="46" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">ESTILO ARQUITECTÓNICO: MONOLITO MODULAR + WORKERS ASÍNCRONOS</text>
  <text x="600" y="66" fill="#94a3b8" font-size="12" text-anchor="middle">Sistema de Gestión Hospitalaria (HRA) · Despliegue Unificado con Fronteras de Dominio y Procesamiento Asíncrono</text>

  <!-- 1. CANAL DE USUARIOS / CLIENTES -->
  <rect x="30" y="100" width="1140" height="90" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#shadow)" />
  <rect x="45" y="88" width="180" height="24" rx="4" fill="#0284c7" />
  <text x="135" y="104" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">CANAL DE ACCESO / CLIENTES</text>

  <!-- Dispositivos / Clientes -->
  <rect x="70" y="125" width="230" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <text x="185" y="146" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">Portal Web del Paciente</text>
  <text x="185" y="162" fill="#94a3b8" font-size="10" text-anchor="middle">React / TypeScript (SPA)</text>

  <rect x="340" y="125" width="230" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <text x="455" y="146" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">Módulo Asistencial y Citas</text>
  <text x="455" y="162" fill="#94a3b8" font-size="10" text-anchor="middle">Admisión y Consultorios Médicos</text>

  <rect x="610" y="125" width="230" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <text x="725" y="146" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">Apoyo Diagnóstico</text>
  <text x="725" y="162" fill="#94a3b8" font-size="10" text-anchor="middle">Laboratorio e Imágenes Médicas</text>

  <rect x="880" y="125" width="230" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <text x="995" y="146" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">Portal de Administración</text>
  <text x="995" y="162" fill="#94a3b8" font-size="10" text-anchor="middle">TI, Parámetros y Auditoría</text>

  <!-- 2. NÚCLEO: MONOLITO MODULAR (UN SOLO PROCESO) -->
  <rect x="30" y="230" width="780" height="420" rx="12" fill="#091422" stroke="#22c55e" stroke-width="2" filter="url(#shadow)" />
  <rect x="50" y="218" width="370" height="24" rx="4" fill="#15803d" />
  <text x="235" y="234" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">BACKEND: MONOLITO MODULAR HRA (UN SOLO ARTEFACTO)</text>

  <!-- Entrada API Gateway / Controladores -->
  <rect x="60" y="255" width="720" height="50" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.2" />
  <text x="420" y="276" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">API REST ENTRYPOINT &amp; ENRUTADOR MODULAR</text>
  <text x="420" y="293" fill="#94a3b8" font-size="11" text-anchor="middle">Validación de DTOs · Autenticación JWT Stateless · Control de Acceso por Roles (RBAC)</text>

  <!-- MÓDULOS DE DOMINIO AISLADOS -->
  <g id="modulos">
    <!-- Módulo 1 -->
    <rect x="60" y="330" width="220" height="70" rx="6" fill="#13271d" stroke="#22c55e" stroke-width="1.2" />
    <text x="170" y="354" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">Módulo Identidad y Acceso</text>
    <text x="170" y="372" fill="#94a3b8" font-size="10" text-anchor="middle">Cuentas, Roles y Permisos</text>
    <text x="170" y="386" fill="#64748b" font-size="9" text-anchor="middle">Schema: auth_*</text>

    <!-- Módulo 2 -->
    <rect x="310" y="330" width="220" height="70" rx="6" fill="#13271d" stroke="#22c55e" stroke-width="1.2" />
    <text x="420" y="354" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">Módulo Gestión Pacientes</text>
    <text x="420" y="372" fill="#94a3b8" font-size="10" text-anchor="middle">Filiación y Validación DNI</text>
    <text x="420" y="386" fill="#64748b" font-size="9" text-anchor="middle">Schema: pacientes_*</text>

    <!-- Módulo 3 -->
    <rect x="560" y="330" width="220" height="70" rx="6" fill="#13271d" stroke="#22c55e" stroke-width="1.5" />
    <text x="670" y="354" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">Módulo Citas Médicas</text>
    <text x="670" y="372" fill="#94a3b8" font-size="10" text-anchor="middle">Agendas, Turnos y Cupos</text>
    <text x="670" y="386" fill="#64748b" font-size="9" text-anchor="middle">Schema: citas_* (Concurrente)</text>

    <!-- Módulo 4 -->
    <rect x="60" y="420" width="220" height="70" rx="6" fill="#13271d" stroke="#22c55e" stroke-width="1.2" />
    <text x="170" y="444" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">Módulo Atenciones Clínicas</text>
    <text x="170" y="462" fill="#94a3b8" font-size="10" text-anchor="middle">Evolución y Acto Médico</text>
    <text x="170" y="476" fill="#64748b" font-size="9" text-anchor="middle">Schema: atenciones_*</text>

    <!-- Módulo 5 -->
    <rect x="310" y="420" width="220" height="70" rx="6" fill="#13271d" stroke="#22c55e" stroke-width="1.2" />
    <text x="420" y="444" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">Módulo Diagnósticos e Informes</text>
    <text x="420" y="462" fill="#94a3b8" font-size="10" text-anchor="middle">Laboratorio e Imágenes Médicas</text>
    <text x="420" y="476" fill="#64748b" font-size="9" text-anchor="middle">Schema: diagnosticos_*</text>

    <!-- Módulo 6 -->
    <rect x="560" y="420" width="220" height="70" rx="6" fill="#13271d" stroke="#22c55e" stroke-width="1.2" />
    <text x="670" y="444" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">Módulo Auditoría y Trazas</text>
    <text x="670" y="462" fill="#94a3b8" font-size="10" text-anchor="middle">Pistas Inmutables (Append-Only)</text>
    <text x="670" y="476" fill="#64748b" font-size="9" text-anchor="middle">Schema: auditoria_*</text>
  </g>

  <!-- BUS DE COMUNICACIÓN EN MEMORIA / EVENTOS -->
  <rect x="60" y="515" width="720" height="48" rx="6" fill="#1e1e38" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="5,3" />
  <text x="420" y="536" fill="#a5b4fc" font-size="12" font-weight="700" text-anchor="middle">EVENT BUS EN MEMORIA (DESACOPLAMIENTO ENTRE MÓDULOS)</text>
  <text x="420" y="552" fill="#94a3b8" font-size="10" text-anchor="middle">CitaConfirmadaEvent · ResultadoDisponibleEvent · AuditoriaSeguridadEvent</text>

  <!-- REGLAS DE AISLAMIENTO -->
  <rect x="60" y="580" width="720" height="50" rx="6" fill="#111827" stroke="#334155" stroke-width="1" />
  <text x="80" y="600" fill="#22c55e" font-size="11" font-weight="700">✓ Integridad Transaccional ACID:</text>
  <text x="270" y="600" fill="#94a3b8" font-size="10">Transacciones directas dentro del mismo proceso sin coordinación distribuida.</text>
  <text x="80" y="618" fill="#22c55e" font-size="11" font-weight="700">✓ Límites de Esquema Estrictos:</text>
  <text x="270" y="618" fill="#94a3b8" font-size="10">Ningún módulo accede a tablas de otro módulo directamente (facilita migración futura).</text>

  <!-- 3. PROCESAMIENTO ASÍNCRONO: WORKERS -->
  <rect x="840" y="230" width="330" height="420" rx="12" fill="#1a1029" stroke="#c084fc" stroke-width="2" filter="url(#shadow)" />
  <rect x="860" y="218" width="220" height="24" rx="4" fill="#7e22ce" />
  <text x="970" y="234" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">WORKERS ASÍNCRONOS</text>

  <!-- Worker 1 -->
  <rect x="860" y="260" width="290" height="80" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
  <text x="1005" y="285" fill="#e9d5ff" font-size="12" font-weight="700" text-anchor="middle">Worker de Notificaciones</text>
  <text x="1005" y="303" fill="#c084fc" font-size="10" text-anchor="middle">Despacho masivo SMTP / WhatsApp</text>
  <text x="1005" y="320" fill="#94a3b8" font-size="9" text-anchor="middle">Reintentos exponenciales automáticos</text>

  <!-- Worker 2 -->
  <rect x="860" y="355" width="290" height="80" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
  <text x="1005" y="380" fill="#e9d5ff" font-size="12" font-weight="700" text-anchor="middle">Worker Generador de PDFs</text>
  <text x="1005" y="398" fill="#c084fc" font-size="10" text-anchor="middle">Renderizado pesado de análisis clínicos</text>
  <text x="1005" y="415" fill="#94a3b8" font-size="9" text-anchor="middle">Descarga la CPU del API principal</text>

  <!-- Worker 3 -->
  <rect x="860" y="450" width="290" height="80" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
  <text x="1005" y="475" fill="#e9d5ff" font-size="12" font-weight="700" text-anchor="middle">Worker de Tareas Programadas</text>
  <text x="1005" y="493" fill="#c084fc" font-size="10" text-anchor="middle">Cron nocturno de recordatorios (24h)</text>
  <text x="1005" y="510" fill="#94a3b8" font-size="9" text-anchor="middle">Liberación de cupos no confirmados</text>

  <!-- Beneficio Worker -->
  <rect x="860" y="550" width="290" height="80" rx="6" fill="#111827" stroke="#6b21a8" stroke-width="1" />
  <text x="1005" y="575" fill="#a855f7" font-size="11" font-weight="700" text-anchor="middle">¿Por qué Workers Desacoplados?</text>
  <text x="1005" y="595" fill="#94a3b8" font-size="9.5" text-anchor="middle">Evitan que operaciones lentas (PDFs o SMTP)</text>
  <text x="1005" y="612" fill="#94a3b8" font-size="9.5" text-anchor="middle">bloqueen la latencia p95 ≤ 3s de las citas.</text>

  <!-- 4. CAPA DE PERSISTENCIA Y ALMACENAMIENTO -->
  <rect x="30" y="680" width="1140" height="190" rx="10" fill="#101924" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="45" y="668" width="290" height="24" rx="4" fill="#b45309" />
  <text x="190" y="684" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PERSISTENCIA, CACHÉ Y SERVICIOS EXTERNOS</text>

  <!-- PostgreSQL -->
  <rect x="60" y="710" width="260" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2" />
  <text x="190" y="736" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL 16 (Relacional)</text>
  <text x="190" y="756" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Tablas con esquemas modulares</text>
  <text x="190" y="774" fill="#94a3b8" font-size="9.5" text-anchor="middle">Garantía ACID · Integridad Referencial</text>

  <!-- Redis -->
  <rect x="350" y="710" width="240" height="90" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2" />
  <text x="470" y="736" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">Redis 7 (In-Memory)</text>
  <text x="470" y="756" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Caché de catálogos y agendas</text>
  <text x="470" y="774" fill="#94a3b8" font-size="9.5" text-anchor="middle">Candados atómicos (SET NX EX) cupos</text>

  <!-- MinIO / S3 -->
  <rect x="620" y="710" width="240" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <text x="740" y="736" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">MinIO / S3 (Object Storage)</text>
  <text x="740" y="756" fill="#e2e8f0" font-size="10.5" text-anchor="middle">Almacén de PDFs clínicos</text>
  <text x="740" y="774" fill="#94a3b8" font-size="9.5" text-anchor="middle">URLs prefirmadas de 15 minutos</text>

  <!-- Sistemas Externos -->
  <rect x="890" y="710" width="260" height="90" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
  <text x="1020" y="736" fill="#c084fc" font-size="14" font-weight="700" text-anchor="middle">Sistemas Externos</text>
  <text x="1020" y="756" fill="#e2e8f0" font-size="10.5" text-anchor="middle">RENIEC (DNI) · SMTP (Correos)</text>
  <text x="1020" y="774" fill="#94a3b8" font-size="9.5" text-anchor="middle">Firma Digital (Sellado PKI)</text>

  <text x="600" y="845" fill="#64748b" font-size="11" text-anchor="middle">Comunicación segura vía HTTPS/TLS 1.3 · Variables de entorno seguras · Monolito con posibilidad de migración futura a microservicios</text>

  <!-- LÍNEAS CONECTORAS ENTRE SECCIONES -->
  <!-- Clientes hacia API Gateway -->
  <line x1="420" y1="190" x2="420" y2="255" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="365" y="208" width="110" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="420" y="221" fill="#38bdf8" font-size="9.5" font-weight="600" text-anchor="middle">HTTPS / REST</text>

  <!-- Monolito hacia Workers -->
  <path d="M 780 440 L 840 440" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-purple)" />
  <rect x="765" y="420" width="85" height="16" rx="3" fill="#0f172a" stroke="#c084fc" stroke-width="0.8"/>
  <text x="807" y="432" fill="#c084fc" font-size="8.5" font-weight="600" text-anchor="middle">Encola Tareas</text>

  <!-- Monolito hacia Base de datos -->
  <line x1="190" y1="650" x2="190" y2="710" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrow-amber)" />
  <!-- Monolito hacia Redis -->
  <line x1="470" y1="650" x2="470" y2="710" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow-amber)" />
  <!-- Monolito hacia MinIO -->
  <line x1="740" y1="650" x2="740" y2="710" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)" />
</svg>
